<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Marketing Head Active Employee List API (Fixed)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 10px; font-size: 16px; }
        input { width: 300px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Marketing Head Active Employee List API (Fixed)</h1>
        <p>This form tests the fixed API endpoint that now uses the correct column names from the actual tbl_user table.</p>
        
        <div class="form-group">
            <label for="userId">User ID:</label>
            <input type="text" id="userId" value="8" placeholder="Enter user ID">
        </div>
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" value="krajeshk" placeholder="Enter username">
        </div>
        
        <button onclick="testAPI()">Test API</button>
        
        <div id="result" class="result" style="display: none;">
            <h3>API Response:</h3>
            <div id="responseContent"></div>
        </div>
    </div>

    <script>
        async function testAPI() {
            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const resultDiv = document.getElementById('result');
            const responseContent = document.getElementById('responseContent');
            
            if (!userId && !username) {
                alert('Please enter either User ID or Username');
                return;
            }
            
            const requestBody = {};
            if (userId) requestBody.user_id = userId;
            if (username) requestBody.username = username;
            
            try {
                const response = await fetch('https://emp.kfinone.com/mobile/api/get_marketing_head_active_emp_list.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                resultDiv.style.display = 'block';
                
                if (data.status === 'success') {
                    responseContent.innerHTML = `
                        <div class="success">
                            <h4>✅ Success!</h4>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Total Count:</strong> ${data.total_count}</p>
                            <p><strong>Active Employees:</strong> ${data.active_employees ? data.active_employees.length : 0}</p>
                        </div>
                        <h4>Response Data:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    responseContent.innerHTML = `
                        <div class="error">
                            <h4>❌ Error!</h4>
                            <p><strong>Status:</strong> ${data.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            ${data.error ? `<p><strong>Error Details:</strong> ${data.error}</p>` : ''}
                        </div>
                        <h4>Full Response:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                resultDiv.style.display = 'block';
                responseContent.innerHTML = `
                    <div class="error">
                        <h4>❌ Network Error!</h4>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
